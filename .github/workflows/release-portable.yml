name: Build Windows portable package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'release') { '${{ github.event.release.tag_name }}' } else { '${{ inputs.tag }}' }
          ./scripts/build-portable.ps1 -ReleaseTag $tag

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forkline-windows-portable
          path: |
            dist/Forkline-v*-windows-x64-portable.zip
            dist/Forkline-v*-windows-x64-portable.zip.sha256

      - name: Attach assets to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'release') { '${{ github.event.release.tag_name }}' } else { '${{ inputs.tag }}' }
          gh release upload $tag dist/Forkline-v*-windows-x64-portable.zip dist/Forkline-v*-windows-x64-portable.zip.sha256 --clobber
